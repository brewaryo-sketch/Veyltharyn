<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Veyltharyn</title><link rel="stylesheet" href="css/main.css"></head><body><main style="max-width:900px;margin:30px auto;padding:20px"><a href="index.html">← Veyltharyn</a><h1>Customer Service / Chat Seller</h1><button onclick="newcs()">Buka Chat CS</button><div id="chats"></div><hr><div id="msgs"></div><div id="send"></div></main><script src="js/marketplace.js"></script><script>let cid=new URLSearchParams(location.search).get('chat_id');async function loadChats(){let d=await api('chats');chats.innerHTML=(d.chats||[]).map(c=>`<button onclick="openChat(${c.id})">Chat #${c.id} • ${c.type} • ${c.status}</button>`).join('<br>')}async function openChat(x){cid=x;history.replaceState({},'',`chat.html?chat_id=${x}`);let d=await api('messages',{qs:{chat_id:x}});msgs.innerHTML=(d.messages||[]).map(m=>`<p><b>${m.is_system?'SYSTEM':m.sender_name}</b>: ${esc(m.body)}</p>`).join('');send.innerHTML='<input id="txt" placeholder="Pesan"><button onclick="sendm()">Kirim</button>'}async function sendm(){let d=await api('send-message',{method:'POST',body:{chat_id:Number(cid),message:txt.value}});txt.value='';openChat(cid)}async function newcs(){let d=await api('chat-create',{method:'POST',body:{type:'cs'}});openChat(d.chat_id);loadChats()}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}loadChats();if(cid)openChat(cid);</script><script src="js/site.js"></script></body></html>
