<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Veyltharyn</title><link rel="stylesheet" href="css/auth.css"></head><body class="auth-page"><main class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">V</span><span>VEYLTHARYN</span></a><h1>Welcome back.</h1><p id="loginNotice">Masuk ke Creator Panel kamu.</p><form id="loginForm"><div class="field"><label>Email atau Username</label><input required name="identity" autocomplete="username"></div><div class="field"><label>Password</label><input required type="password" name="password" autocomplete="current-password"></div><button class="btn primary" type="submit">Login</button></form><div class="auth-foot">Belum punya akun? <a href="register.html">Register</a></div></main><script src="js/auth.js"></script><script>
(()=>{const q=new URLSearchParams(location.search);if(q.get("registered")==="1"){const email=q.get("email")||"";const notice=document.getElementById("loginNotice");if(notice)notice.textContent="Akun berhasil dibuat. Masukan Email & Sandi yang telah Anda buat.";const input=document.querySelector('#loginForm input[name="identity"]');if(input&&email){input.value=email;input.focus();}}})();
</script><script src="js/site.js"></script></body></html>
