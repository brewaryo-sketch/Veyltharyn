<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Veyltharyn Marketplace</title><link rel="stylesheet" href="css/main.css"><style>.shop{max-width:1100px;margin:40px auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:20px}.search{display:flex;gap:10px;margin:20px 0}.search input,.search select{padding:12px;background:#111;color:#fff;border:1px solid #444;border-radius:8px}</style></head><body><main class="shop"><a href="index.html">← Veyltharyn</a><h1>Marketplace</h1><p>Produk komunitas Veyltharyn.</p><div class="search"><input id="q" placeholder="Cari produk / Product ID"><select id="cat"><option value="">Semua kategori</option><option>VIP</option><option>Item</option><option>Pet</option><option>Tanaman</option><option>Lainnya</option></select><button onclick="load()">Cari</button></div><div id="list" class="grid"></div></main><script src="js/marketplace.js"></script><script>async function load(){let d=await api('products',{qs:{q:q.value,category:cat.value}});list.innerHTML=(d.products||[]).map(p=>`<article class="card"><h3>${esc(p.name)}</h3><p>${esc(p.description||'')}</p><b>Rp ${Number(p.price).toLocaleString('id-ID')}</b><p>Seller: ${esc(p.seller)}<br>ID: ${p.product_id}</p><a class="btn" href="product.html?id=${encodeURIComponent(p.product_id)}">Cek Produk</a></article>`).join('')||'<p>Tidak ada produk.</p>'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script><script src="js/site.js"></script></body></html>
