<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Shop — Veyltharyn</title><link rel="stylesheet" href="css/main.css"><style>main{max-width:1100px;margin:30px auto;padding:20px}.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{padding:20px}.panel input,.panel textarea,.panel select{width:100%;margin:7px 0;padding:11px;background:#111;color:#fff;border:1px solid #444;border-radius:8px;box-sizing:border-box}.preview{max-width:180px;max-height:180px;border-radius:10px;border:1px solid #444;display:none}.product{padding:14px;margin:10px 0;border:1px solid #333;border-radius:10px;background:#1118}.product img{width:90px;height:90px;object-fit:cover;border-radius:8px;float:left;margin-right:12px}.role{opacity:.8;font-size:13px}</style></head><body><main><a href="dashboard.html">← Dashboard</a><h1>My Shop</h1><p class="role">Upload produk tersedia untuk member. Owner/Admin dapat mengelola semua produk.</p><div class="shop-grid"><section class="panel"><h2>Upload Produk</h2><form id="f"><input name="name" placeholder="Nama produk" required><input name="price" type="number" min="0" placeholder="Harga" required><input name="category" placeholder="Kategori" required><input name="whatsapp" placeholder="WhatsApp" required><input name="email" type="email" placeholder="Email penjual"><textarea name="description" placeholder="Deskripsi" required></textarea><input id="photo" name="photo" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="Preview"><button class="btn primary" type="submit">+ Tambah Produk</button></form></section><section class="panel"><h2>Pesanan Masuk</h2><div id="orders">Memuat...</div></section></div><h2>Produk Saya / Produk Terkelola</h2><div id="list">Memuat...</div></main><script src="js/marketplace.js"></script><script>const current=JSON.parse(localStorage.getItem('veyltharyn_session')||'null');const manager=['owner','admin','admin_cs','staff'].includes(current?.role);const f=document.getElementById('f'),photo=document.getElementById('photo'),preview=document.getElementById('preview');photo.addEventListener('change',()=>{const file=photo.files[0];if(!file){preview.style.display='none';return}const r=new FileReader();r.onload=()=>{preview.src=r.result;preview.style.display='block'};r.readAsDataURL(file)});async function load(){try{let d=await api('my-products');list.innerHTML=(d.products||[]).map(p=>`<div class="product">${p.photo?`<img src="${p.photo}" alt="">`:''}<b>${esc(p.name)}</b><br><small>${p.product_id} • ${esc(p.category)} • Rp ${Number(p.price).toLocaleString('id-ID')}</small><br><span>Status: ${esc(p.status)}</span><br><button class="btn" onclick="del('${p.product_id}')">Hapus</button></div>`).join('')||'<p>Belum ada produk.</p>';let o=await api('orders');orders.innerHTML=(o.orders||[]).map(x=>`<div class="product"><b>${esc(x.order_id)}</b> — ${esc(x.name)} — ${esc(x.status)} ${x.status==='pending'?`<button class="btn" onclick="st('${x.order_id}','accepted')">Terima</button> <button class="btn" onclick="rej('${x.order_id}')">Tolak</button>`:''}</div>`).join('')||'<p>Belum ada pesanan.</p>'}catch(e){alert(e.message)}}f.addEventListener('submit',async e=>{e.preventDefault();const file=photo.files[0];if(file&&file.size>1000*1000) return alert('Ukuran gambar maksimal 1 MB.');let body={name:f.name.value,price:f.price.value,category:f.category.value,whatsapp:f.whatsapp.value,email:f.email.value,description:f.description.value};if(file){body.photo={data:await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}}try{let d=await api('create-product',{method:'POST',body});alert(d.ok?'Produk dibuat: '+d.product_id:d.error);f.reset();preview.style.display='none';load()}catch(e){alert(e.message)}});async function del(id){if(!confirm('Hapus produk ini?'))return;try{let d=await api('delete-product',{method:'POST',body:{product_id:id}});alert(d.ok?'Produk dihapus.':d.error);load()}catch(e){alert(e.message)}}async function st(id,s,reason=''){try{let d=await api('order-status',{method:'POST',body:{order_id:id,status:s,reason}});alert(d.ok?'Berhasil':d.error);load()}catch(e){alert(e.message)}}function rej(id){st(id,'rejected',prompt('Alasan penolakan:')||'Tidak tersedia')}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load()</script><script src="js/site.js"></script></body></html>
